name: build

on:
  push:
    branches:
      - master
      - develop
      - "feature/**"
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar
        run: make

      - name: Render de prueba
        run: ./raytracer.exe -i busto.stl -o out -n 1 -w 64 -H 64 -s 1

      - name: Verificar PGM
        run: |
          test "$(head -c 2 out/frame_0000.pgm)" = "P5"
          test "$(stat -c %s out/frame_0000.pgm)" -eq 4109
